name: Docker Image CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build the Docker image
        run: |
          apt update 
          apt install dos2unix -y sudo
          sudo apt update && sudo apt install dos2unix -y && apt clean && rm -rf /var/lib/apt/lists/*
          bash -c "find . -maxdepth 1 -type f -name \"*.sh\" -exec dos2unix {} \;"
          sh build.sh
      - run: mkdir -p ./dist
      - run: docker images
      - name: Build and save
        run: docker save masx200/ubuntu-maven-gradle-msopenjdk:latest | gzip > ./dist/masx200-ubuntu-maven-gradle-msopenjdk-latest-image.tgz

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: Continuous-integration-${{ github.sha }}
          #token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          files: |
            ./dist/*.tgz
